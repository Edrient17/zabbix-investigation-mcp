name: zabbix-investigation-mcp

services:
  zabbix-mcp:
    build:
      context: .
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
    # Published on the bind address only. Docker inserts its forwarding rules
    # ahead of ufw, so a host firewall will not contain a 0.0.0.0 publish --
    # the bind address is what actually limits exposure. Default to loopback so
    # an unset value cannot silently expose the server on a public interface.
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PUBLISHED_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
